[package]
name = "proxyx"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Loopback-first HTTP forward proxy with HTTPS CONNECT tunnelling"

[dependencies]
anyhow = "1"
bytes = "1"
env_logger = "0.11"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio", "http1"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
url = "2"
